# Low figure-eight for ground-effect teaching (NED, z+ down).
# Paired with default_quadrotor_ge (ground_z_ned_m=1.05, R≈0.12 m).
# Path stays near the deck so κ(h) is material without requiring pure hover.
schema_version: 1
name: figure_eight_low_ge
description: >
  Compressed-altitude figure-eight near ground for GE plant demos.
frame: NED
waypoints:
