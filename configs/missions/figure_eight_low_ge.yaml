  - {label: right_bottom, time: 12.0, x: 1.0, y: -0.5, z: 0.90, yaw: 0.0}
  - {label: center_cross, time: 16.0, x: 0.0, y: 0.0, z: 0.95, yaw: 0.0}
  - {label: left_bottom, time: 20.0, x: -1.0, y: -0.5, z: 1.00, yaw: 0.0}
  - {label: left_peak, time: 24.0, x: -2.0, y: 0.0, z: 1.00, yaw: 0.0}
  - {label: left_top, time: 28.0, x: -1.0, y: 0.5, z: 0.95, yaw: 0.0}
