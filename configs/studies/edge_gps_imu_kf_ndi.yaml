# Edge NDI × gps_imu_kf twin.
schema_version: 1
study_id: edge_gps_imu_kf_ndi
seed: 7
vehicle: configs/vehicles/default_quadrotor.yaml
controller:
  type: ndi_cascade
  kp_pos: [4.0, 4.0, 9.0]
  kd_pos: [3.0, 3.0, 5.0]
  k_R: [12.0, 12.0, 3.0]
  k_omega: [1.2, 1.2, 0.5]
  max_tilt_rad: 0.7
  invert_model: vacuum_rigid_body
  f_min_frac_hover: 0.05

guidance:
  type: waypoints
  mission_file: configs/missions/figure_eight_envelope_edge.yaml
  method: auto
  yaw_mode: from_waypoints
  sample_dt_s: 0.01
  fail_on_infeasible: false
sim:
  dt_s: 0.01
  method: rk45
  rtol: 1.0e-5
  atol: 1.0e-7
  attitude: euler
  observer:
    type: linear_kf
    seed: 7
    pos_sigma_m: 0.05
    vel_sigma_m_s: 0.05
    att_sigma_rad: 0.03
    omega_sigma_rad_s: 0.04
    process_sigma: 0.03
    channels: [pos, omega]
metrics:
  position_bound_m: 0.75
