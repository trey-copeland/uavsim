# Edge-of-envelope twin of figure_eight_ndi (τ★=0.28 + scheduled yaw).
# study_id / gallery run_id: edge_figure_eight_ndi
schema_version: 1
study_id: edge_figure_eight_ndi
seed: 0
vehicle: configs/vehicles/default_quadrotor.yaml
controller:
  type: ndi_cascade
  kp_pos: [4.0, 4.0, 9.0]
  kd_pos: [3.0, 3.0, 5.0]
  k_R: [12.0, 12.0, 3.0]
  k_omega: [1.2, 1.2, 0.5]
  max_tilt_rad: 0.7
  invert_model: vacuum_rigid_body
  f_min_frac_hover: 0.05

guidance:
  type: waypoints
  mission_file: configs/missions/figure_eight_envelope_edge.yaml
  method: auto
  yaw_mode: from_waypoints
  sample_dt_s: 0.01
  fail_on_infeasible: false
sim:
  dt_s: 0.01
  method: rk45
  rtol: 1.0e-5
  atol: 1.0e-7

metrics:
  position_bound_m: 0.75
