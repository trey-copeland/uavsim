# Intercept-class X-quadrotor (~1.5 kg, high T/W) for aggressive NDI intercept demos.
# Does not replace default_quadrotor (0.5 kg teaching plant).
schema_version: 1
vehicle_id: intercept_quadrotor

mass_kg: 1.5
gravity_m_s2: 9.81
arm_length_m: 0.32

inertia:
  # ~ m L^2 scale vs 0.5 kg / 0.25 m defaults
  ixx_kg_m2: 0.035
  iyy_kg_m2: 0.035
  izz_kg_m2: 0.060

# T/W ≈ 4.5 → F_max ≈ 4.5 * m * g
limits:
  thrust_min_n: 0.0
  thrust_max_n: 66.2
  torque_max_nm: 4.0

propulsion:
  layout: x
  # Sized so hover ω stays ~600–700 rad/s class at this mass
  ct_n_s2: 1.02e-5
  cq_nm_s2: 1.6e-7
  motor_time_const_s: 0.05
  omega_min_rad_s: 0.0
  omega_max_rad_s: 1400.0

aero:
  drag_lin_ns_m: 0.0
  drag_quad_ns2_m2: 0.0
  rate_damp_nm_s: 0.0
  prop_h_s_per_m: 0.0
  ground_effect: none
  rotor_radius_m: 0.12
  ground_z_ned_m: 0.0
  ge_exp_a: 0.5
  ge_exp_b: 2.0
  ge_kappa_max: 3.0
