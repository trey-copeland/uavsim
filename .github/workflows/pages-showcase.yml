# Deprecated alias: site deploy moved to pages-site.yml (showcase + intercept).
# Keep this file so old path filters / bookmarks still trigger a deploy.
# Triggers re-run of the combined workflow via a thin dispatch note — actually
# GitHub cannot call another workflow by path filter alone, so we re-include
# the same job logic by calling the reusable pattern: this workflow is a
# thin wrapper that just runs the combined assembly (duplication avoided by
# making this workflow `workflow_call` consumer).
#
# Simpler approach used here: redirect maintainers and trigger on the same
# events by including a note; the real deploy is pages-site.yml.
name: Pages showcase (legacy name)

on:
  workflow_dispatch:
  # When someone still has this workflow enabled, push path mirror is removed
  # so we do not double-deploy. Use pages-site.yml.

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect
        run: |
          echo "Showcase + intercept deploy lives in .github/workflows/pages-site.yml"
          echo "Dispatch that workflow (or push to docs/showcase/** or docs/demos/intercept/** on main)."
          exit 0
